[metadata]
name = bandit-sensitive-data-plugin
summary = Custom Bandit plugin for detecting sensitive data and insecure encryption
description = A custom plugin for Bandit that detects hardcoded sensitive information and insecure encryption algorithms in Python code.
author = Security Team
author_email = security@example.com
homepage = https://github.com/your-organization/bandit-sensitive-data-plugin
license = Apache-2.0
classifiers =
    Development Status :: 4 - Beta
    Environment :: Console
    Intended Audience :: Information Technology
    Intended Audience :: System Administrators
    Intended Audience :: Developers
    Operating System :: POSIX :: Linux
    Operating System :: MacOS :: MacOS X
    Operating System :: Microsoft :: Windows
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Security
    Topic :: Software Development :: Quality Assurance

[options]
python_requires = >=3.8
packages = find:
install_requires = bandit>=1.7.0
[options.extras_require]
tests =
    pytest
    bandit

[options.entry_points]
bandit.plugins =
    sc100_hardcoded_password = sensitive_data_plugin.checks.hardcoded.assign_detect:hardcoded_password_assign
    sc101_dict_sensitive = sensitive_data_plugin.checks.hardcoded.dict_detect:dict_sensitive_info
    sc102_funcarg_sensitive = sensitive_data_plugin.checks.hardcoded.funcarg_detect:funcarg_sensitive_info
    sc200_weak_hash = sensitive_data_plugin.checks.crypto.weak_hash:weak_hash_algorithm
    sc201_weak_cipher = sensitive_data_plugin.checks.crypto.weak_cipher:weak_cipher_algorithm
    sc202_unsafe_mode = sensitive_data_plugin.checks.crypto.unsafe_mode:unsafe_encryption_mode
    sc203_weak_key = sensitive_data_plugin.checks.crypto.weak_key:weak_cryptographic_key
